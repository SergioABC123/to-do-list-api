name: Health Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Cargar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Consultar /health desde EC2
        shell: bash
        run: |
          instance_id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=todo-list-api" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)

          if [[ ! "$instance_id" =~ ^i-[0-9a-f]+$ ]]; then
            echo "Se esperaba exactamente una EC2 todo-list-api en ejecución."
            exit 1
          fi

          command_id=$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["curl -fsS --max-time 15 http://127.0.0.1:8000/health"],"executionTimeout":["30"]}' \
            --query 'Command.CommandId' --output text)

          result=0
          aws ssm wait command-executed \
            --command-id "$command_id" --instance-id "$instance_id" || result=$?

          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$instance_id" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

          exit "$result"