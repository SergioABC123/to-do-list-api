name: Deploy

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

concurrency:
  group: todo-list-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Cargar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Desplegar en EC2 con Run Command
        env:
          VERSION: ${{ inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Etiqueta inválida: $VERSION"
            exit 1
          fi

          instance_id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=todo-list-api" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)

          if [[ ! "$instance_id" =~ ^i-[0-9a-f]+$ ]]; then
            echo "Se esperaba exactamente una EC2 todo-list-api en ejecución."
            exit 1
          fi

          script=$(base64 -w 0 scripts/deploy.sh)
          printf -v remote_command 'printf %%s %q | base64 -d | bash -s -- %q %q' \
            "$script" "$GITHUB_REPOSITORY" "$VERSION"

          parameters=$(jq -n --arg command "$remote_command" \
            '{commands: [$command], executionTimeout: ["600"]}')

          command_id=$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --parameters "$parameters" \
            --query 'Command.CommandId' --output text)

          echo "Comando SSM: $command_id"

          for attempt in {1..60}; do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$instance_id" \
              --query Status --output text 2>/dev/null) || status=Pending

            case "$status" in
              Pending|InProgress|Delayed|Cancelling) sleep 10 ;;
              *)
                aws ssm get-command-invocation \
                  --command-id "$command_id" --instance-id "$instance_id" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
                [[ "$status" == "Success" ]]
                exit
                ;;
            esac
          done

          echo "Se agotó la espera del comando SSM."
          exit 1